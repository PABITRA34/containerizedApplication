apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopping-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: stockmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockmanager
                port:
                  number: 8030
    - host: productcatalogue.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: productcatalogue
                port:
                  number: 8020
    - host: shopfront.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopfront
                port:
                  number: 8010
